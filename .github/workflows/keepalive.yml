name: keepalive

# Ruft täglich die Supabase-API ab, damit das Free-Projekt nicht pausiert wird.
# Am 1. jedes Monats schreibt der Lauf einen Commit (keepalive.txt), damit GitHub
# den geplanten Workflow nicht nach 60 Tagen ohne Repo-Aktivität deaktiviert.
on:
  schedule:
    - cron: '17 5 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Supabase abfragen
        run: |
          URL=$(grep -o "https://[a-z0-9]*\.supabase\.co" weinkeller-app2.html | head -1)
          KEY=$(grep -o "eyJ[A-Za-z0-9_-]*\.[A-Za-z0-9_-]*\.[A-Za-z0-9_-]*" weinkeller-app2.html | head -1)
          CODE=$(curl -s -o /dev/null -w "%{http_code}" "$URL/rest/v1/weine?select=id&limit=1" -H "apikey: $KEY" -H "Authorization: Bearer $KEY")
          echo "Supabase antwortet mit HTTP $CODE"
          test "$CODE" = "200"

      - name: Monatlicher Commit
        run: |
          if [ "$(date -u +%d)" = "01" ]; then
            date -u +%Y-%m-%dT%H:%M:%SZ > keepalive.txt
            git config user.name "keepalive"
            git config user.email "keepalive@users.noreply.github.com"
            git add keepalive.txt
            git commit -m "keepalive $(date -u +%Y-%m)"
            git push
          fi
